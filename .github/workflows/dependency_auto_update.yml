name: Dependency Auto-Update Service

on:
  schedule:
    # Run every Monday at 9:00 AM UTC (weekly security check)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual changes)'
        required: false
        default: 'false'
        type: boolean
      force:
        description: 'Force update even if no vulnerabilities found'
        required: false
        default: 'false'
        type: boolean

jobs:
  security-update:
    name: Check for Security Updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools requests pip-audit

      - name: Run dependency security scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          DRY_RUN_FLAG=""
          FORCE_FLAG=""

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          python scripts/dependency_auto_update.py $DRY_RUN_FLAG $FORCE_FLAG

      - name: Create commit and push changes
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Create a new branch for security updates
          BRANCH_NAME="security-update-$(date +%Y%m%d)"
          git checkout -b "$BRANCH_NAME"

          # Add and commit changes
          git add requirements.in requirements.txt
          git commit -m "Security Update: Automated dependency updates

          - Updated requirements.in with security patches
          - Regenerated requirements.txt using pip-compile

          This commit was automatically generated by the Dependency Auto-Update Service (Task 48)"

          # Push the branch
          git push origin "$BRANCH_NAME"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Dependency Auto-Update Service Failed',
              body: `The weekly dependency security scan failed.

              **Workflow Run:** ${context.payload.workflow_run?.html_url || context.payload.repository.html_url + '/actions/runs/' + context.runId}
              **Time:** ${new Date().toISOString()}

              Please check the workflow logs for details.

              ---
              *This issue was automatically created by the Dependency Auto-Update Service (Task 48)*`,
              labels: ['bug', 'security', 'dependencies']
            })